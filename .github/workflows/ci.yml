name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/roomzly_db"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/roomzly_db"
      JWT_SECRET: "super-secret-key-for-testing-purposes-only-32bytes"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: TypeScript Typecheck & Build
        run: npm run build

      - name: Run Tests
        run: npm run test

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Vite Production Build
        run: npm run build
        env:
          VITE_API_URL: https://roomzly-backend.onrender.com/api/v1
